<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGRI-OPS · 温室集群日志智能分析控制台</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   设计方向：工业控制室 / 磷光终端
   · 概念：不是通用 SaaS 仪表盘，而是"园区运维值班台"的一面状态墙
   · 主色：磷光绿（数据显示色）＋ 琥珀（告警）＋ 赤红（故障）
   · 字体：等宽驱动全部数字与日志；标题用窄体无衬线营造工业铭牌感
   · 质感：极暗底 + 半透明面板 + 网格底纹 + 微弱扫描线，模拟监视器
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  --bg:        #07090a;
  --bg-grid:   #0c1113;
  --panel:     rgba(16,22,24,.72);
  --panel-2:   rgba(22,30,33,.6);
  --line:      rgba(120,200,170,.14);
  --line-hard: rgba(120,200,170,.28);

  --ink:       #cfe8dd;
  --ink-dim:   #6f8a82;
  --ink-faint: #44544f;

  --phosphor:  #3ce68b;
  --amber:     #ffb02e;
  --crimson:   #ff4d4d;
  --cyan:      #46c8d8;
  --violet:    #9d7bff;

  --mono: "JetBrains Mono","Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  --disp: "Bahnschrift","DIN Alternate","Franklin Gothic Medium","Arial Narrow",sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--mono); font-size:13px; line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* 网格底纹 + 扫描线，制造监视器质感 */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(var(--bg-grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:44px 44px;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:9999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply; opacity:.5;
}

/* ── 布局 ───────────────────────────────────────────────────────────── */
.shell{
  position:relative; z-index:1;
  height:100vh; display:grid;
  grid-template-rows:auto auto 1fr;
  gap:10px; padding:12px;
}

/* ── 顶栏 ───────────────────────────────────────────────────────────── */
.topbar{
  display:flex; align-items:center; gap:18px;
  border:1px solid var(--line-hard); background:var(--panel);
  padding:10px 16px; position:relative;
}
.topbar::before{ /* 铭牌左侧色条 */
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg,var(--phosphor),transparent);
}
.brand{display:flex; flex-direction:column; gap:1px}
.brand h1{
  font-family:var(--disp); font-size:20px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--phosphor);
  text-shadow:0 0 18px rgba(60,230,139,.35); line-height:1;
}
.brand .sub{font-size:10px; letter-spacing:.22em; color:var(--ink-faint); text-transform:uppercase}

.live{
  display:flex; align-items:center; gap:7px; margin-left:6px;
  font-size:10px; letter-spacing:.18em; color:var(--phosphor);
  border:1px solid rgba(60,230,139,.3); padding:3px 9px;
}
/* 回放模式：琥珀色 + 明确标注，避免误认为连着真机 */
.live.replay{color:var(--amber); border-color:rgba(255,176,46,.42); background:rgba(255,176,46,.07)}
.live.replay .dot{background:var(--amber); box-shadow:0 0 8px var(--amber)}
/* 实时但离线：赤红 + 停止跳动 */
.live.offline{color:var(--crimson); border-color:rgba(255,77,77,.45); background:rgba(255,77,77,.08)}
.live.offline .dot{background:var(--crimson); box-shadow:0 0 8px var(--crimson); animation:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--phosphor);
  box-shadow:0 0 8px var(--phosphor); animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

/* 日志流面板标题旁的模式提示条：一眼看清是"回放"还是"实时" */
.modechip{
  font-size:10px; letter-spacing:.12em; padding:2px 7px; margin-left:8px;
  border:1px solid var(--line); color:var(--ink-faint); white-space:nowrap;
}
.modechip.replay{color:var(--amber); border-color:rgba(255,176,46,.4); background:rgba(255,176,46,.06)}
.modechip.live  {color:var(--phosphor); border-color:rgba(60,230,139,.34); background:rgba(60,230,139,.06)}
.modechip.offline{color:var(--crimson); border-color:rgba(255,77,77,.42); background:rgba(255,77,77,.07)}

/* 设备端模式徽标：纯真实数据（绿） / 故障注入中（琥珀，闪一下提示） */
.devmode{
  display:flex; align-items:center; gap:6px; margin-left:6px;
  font-size:10px; letter-spacing:.14em; padding:3px 9px;
  border:1px solid var(--line); color:var(--ink-faint); white-space:nowrap;
}
.devmode.real{color:var(--phosphor); border-color:rgba(60,230,139,.4); background:rgba(60,230,139,.07)}
.devmode.inject{color:var(--amber); border-color:rgba(255,176,46,.45); background:rgba(255,176,46,.08)}
.devmode.inject #devModeTxt::before{content:"⚡ "}
.devmode.real   #devModeTxt::before{content:"✔ "}

/* 设备选择器：切换后整块看板换视角 */
.devsel{
  display:flex; align-items:center; gap:6px; margin-left:10px;
  border:1px solid var(--line); padding:2px 8px; background:var(--panel-2);
}
.devsel .lb{font-size:10px; letter-spacing:.18em; color:var(--ink-faint)}
.devsel select{
  background:transparent; border:none; color:var(--phosphor);
  font-family:var(--mono); font-size:11px; font-weight:600;
  outline:none; cursor:pointer; padding:2px 0;
}
.devsel select option{background:var(--panel); color:var(--ink)}
.devsel.on{border-color:rgba(60,230,139,.45); background:rgba(60,230,139,.07)}

/* 报告来源标注：真机 vs 模拟数据集，必须一眼可分 */.rep .src{
  font-size:9px; letter-spacing:.1em; padding:1px 5px;
  border:1px solid var(--line); white-space:nowrap;
}
.rep .src.live{color:var(--phosphor); border-color:rgba(60,230,139,.4); background:rgba(60,230,139,.07)}
.rep .src.sim {color:var(--amber); border-color:rgba(255,176,46,.4); background:rgba(255,176,46,.07)}
.btn.an{color:var(--cyan); border-color:rgba(70,200,216,.4); margin-left:6px}
.btn.an:hover{background:rgba(70,200,216,.12)}
.btn.an.busy{color:var(--amber); border-color:rgba(255,176,46,.45); cursor:progress}
.btn.an:disabled{opacity:.75}
/* 报告来源过滤：默认「只看真机」，避免模拟数据集的报告被误当成真机结论 */
.btn.src{color:var(--phosphor); border-color:rgba(60,230,139,.4);
  background:rgba(60,230,139,.07); margin-left:auto}
.btn.src.all{color:var(--amber); border-color:rgba(255,176,46,.4); background:rgba(255,176,46,.07)}
/* 重新连接：离线时才醒目，提示"这里能救" */
.btn.rc{color:var(--ink-faint); border-color:var(--line)}
.btn.rc:hover{color:var(--phosphor); border-color:rgba(60,230,139,.4); background:rgba(60,230,139,.08)}
.btn.rc.need{color:var(--crimson); border-color:rgba(255,77,77,.5);
  background:rgba(255,77,77,.1); animation:blink 1.2s step-end infinite}
.btn.rc.busy{color:var(--amber); border-color:rgba(255,176,46,.45); cursor:progress}
.anNote{
  font-size:10px; color:var(--phosphor); padding:6px 8px; margin-bottom:6px;
  border:1px dashed rgba(60,230,139,.35); background:rgba(60,230,139,.05);
}

.kpis{display:flex; gap:0; margin-left:auto; align-items:stretch}
.kpi{
  padding:2px 16px; border-left:1px solid var(--line);
  display:flex; flex-direction:column; gap:1px; min-width:96px;
}
.kpi:first-child{border-left:none}
.kpi .k{font-size:9px; letter-spacing:.14em; color:var(--ink-faint); text-transform:uppercase}
.kpi .v{font-size:19px; font-weight:600; line-height:1.15; color:var(--ink)}
.kpi .v.g{color:var(--phosphor)} .kpi .v.a{color:var(--amber)} .kpi .v.c{color:var(--crimson)}
.kpi .u{font-size:10px; color:var(--ink-faint); margin-left:2px}

/* ── 主网格 ─────────────────────────────────────────────────────────── */
/* ★ 可拖动布局：列宽/行高全部走 CSS 变量，拖拽条改这些变量即可。
     变量挂在 .grid 上，面板尺寸跟着 grid 走，不用手动算面板大小。 */
.grid{
  display:grid; gap:10px; min-height:0; position:relative;
  --gc1:268px;    /* 左列（故障码 / 异常族） */
  --gc3:400px;    /* 右列（环境曲线 / 报告）—— 给宽一点，曲线才看得清 */
  --gr1:170px;    /* 第一行高 */
  --gr2:150px;    /* 第二行高 */
  grid-template-columns: var(--gc1) 1fr var(--gc3);
  grid-template-rows: var(--gr1) var(--gr2) 1fr;
  grid-template-areas:
    "faults  timeline  zones"
    "fams    timeline  zones"
    "fams    stream    reports";
}

/* 拖拽条：绝对定位覆盖在网格间隙上，平时透明，悬停/拖动时才显形 */
.splitter{position:absolute; z-index:30; background:transparent; transition:background .12s}
.splitter:hover,.splitter.drag{background:rgba(60,230,139,.55)}
.splitter.v{width:11px; margin-left:-5px; cursor:col-resize}
.splitter.h{height:11px; margin-top:-5px; cursor:row-resize}
/* 拖动时禁止选中文字，否则会拖出一片蓝色选区；canvas 也要禁掉 pointer-events */
body.resizing{user-select:none}
body.resizing canvas{pointer-events:none}

@media (max-width:1280px){
  .grid{grid-template-columns:var(--gc1) 1fr; grid-template-rows:auto auto 1fr;
    grid-template-areas:
      "faults timeline" "fams stream" "reports reports";}
  .grid .zones{display:none}
  .splitter{display:none}
}
@media (max-width:900px){
  body{overflow:auto}
  .shell{height:auto}
  .grid{grid-template-columns:1fr; grid-template-rows:auto;
    grid-template-areas:"timeline" "stream" "faults" "fams" "reports";}
}

/* 异常族卡片：把"反复出现的同一类异常"压成一条，一眼看出频次 */
.fam{
  display:grid; grid-template-columns:1fr auto; gap:2px 8px;
  padding:6px 8px; border-left:2px solid var(--violet);
  background:rgba(157,123,255,.05); margin-bottom:5px;
}
.fam .nm{font-size:11px; color:var(--ink); font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fam .ct{font-size:13px; color:var(--violet); font-weight:700;
  font-family:var(--mono); line-height:1}
.fam .meta{grid-column:1/3; font-size:9px; color:var(--ink-faint);
  font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fam .key{color:var(--violet); opacity:.75}

.panel{
  border:1px solid var(--line); background:var(--panel);
  display:flex; flex-direction:column; min-height:0; position:relative;
  backdrop-filter:blur(2px);
}
.panel > header{
  display:flex; align-items:center; gap:8px;
  padding:7px 11px; border-bottom:1px solid var(--line);
  background:var(--panel-2); flex:0 0 auto;
}
.panel > header h2{
  font-family:var(--disp); font-size:11px; font-weight:600;
  letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim);
}
.panel > header .cnt{
  margin-left:auto; font-size:10px; color:var(--ink-faint); letter-spacing:.08em;
}
.panel .body{overflow:auto; min-height:0; flex:1 1 auto}
.panel .body::-webkit-scrollbar{width:9px;height:9px}
.panel .body::-webkit-scrollbar-thumb{background:rgba(120,200,170,.2)}
.panel .body::-webkit-scrollbar-track{background:transparent}

.faults{grid-area:faults} .timeline{grid-area:timeline}
.stream{grid-area:stream} .zones{grid-area:zones} .reports{grid-area:reports}

/* ── 故障码列表 ─────────────────────────────────────────────────────── */
.fault{
  display:grid; grid-template-columns:auto 1fr auto; gap:9px; align-items:center;
  padding:7px 11px; border-bottom:1px solid rgba(120,200,170,.07);
  cursor:default; transition:background .12s;
}
.fault:hover{background:rgba(60,230,139,.05)}
.fault .code{
  font-size:10px; font-weight:600; letter-spacing:.04em; padding:1px 5px;
  border:1px solid currentColor; color:var(--crimson); white-space:nowrap;
}
.fault.normal .code{color:var(--ink-faint)}
.fault .nm{font-size:11px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fault.normal .nm{color:var(--ink-faint)}
.fault .ct{
  font-size:12px; font-weight:600; color:var(--phosphor); min-width:26px; text-align:right;
}
/* 次数条 */
.fault .bar{
  grid-column:1/-1; height:2px; background:rgba(120,200,170,.1); margin-top:-3px;
}
.fault .bar i{display:block; height:100%; background:var(--crimson); opacity:.55}
.fault.normal .bar i{background:var(--ink-faint)}

/* ── 图表 ───────────────────────────────────────────────────────────── */
canvas{display:block; width:100%}
.chart-wrap{position:relative; padding:8px 10px}
.legend{display:flex; gap:14px; padding:0 11px 8px; font-size:10px; color:var(--ink-faint)}
.legend i{display:inline-block;width:8px;height:2px;vertical-align:middle;margin-right:5px}

/* 大棚卡片 */
.zgrid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line)}
/* .zones 面板只有一个设备时（单设备模式）铺满整行，别挤在半边 */
.zgrid.one{grid-template-columns:1fr}

/* 指标选择器：切换看哪条曲线 */
.metricsel{display:flex; gap:0; margin-left:auto}
.mb{
  background:transparent; border:1px solid var(--line); border-right:none;
  color:var(--ink-faint); font-family:var(--mono); font-size:10px;
  padding:2px 8px; cursor:pointer; letter-spacing:.06em;
}
.mb:last-child{border-right:1px solid var(--line)}
.mb:hover{color:var(--ink)}
.mb.on{color:var(--phosphor); background:rgba(60,230,139,.1); border-color:rgba(60,230,139,.45)}
.btn.big{color:var(--cyan); border-color:rgba(70,200,216,.4); margin-left:6px}
.btn.big:hover{background:rgba(70,200,216,.12)}

/* 曲线放大浮层：整屏看趋势 */
.bigchart{
  position:fixed; inset:0; z-index:9997; background:rgba(6,10,9,.96);
  display:none; flex-direction:column; padding:14px 18px; backdrop-filter:blur(3px);
}
.bigchart.open{display:flex}
.bigchart header{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.bigchart h3{font-family:var(--disp); font-size:18px; letter-spacing:.2em; color:var(--phosphor)}
.bigchart .wrap{flex:1; min-height:0; position:relative}
.bigchart canvas{width:100%; height:100%; display:block}
.bigchart .lg{display:flex; flex-wrap:wrap; gap:14px; margin-top:8px; font-size:11px; color:var(--ink-dim)}
.bigchart .lg i{display:inline-block; width:14px; height:3px; margin-right:5px; vertical-align:middle}
.zcard{background:var(--panel); padding:8px 10px; display:flex; flex-direction:column; gap:5px}
.zcard .zh{display:flex; align-items:baseline; gap:6px}
.zcard .zz{
  font-family:var(--disp); font-size:15px; font-weight:700; color:var(--phosphor);
  letter-spacing:.06em;
}
.zcard .zn{font-size:9px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.zcard .zrow{display:flex; justify-content:space-between; font-size:11px}
.zcard .zrow span:first-child{color:var(--ink-faint); font-size:10px}
.zcard canvas{height:26px}

/* ── 日志流（主角）──────────────────────────────────────────────────── */
.stream .body{padding:0}
.logline{
  display:grid; grid-template-columns:132px 26px 54px 96px 1fr;
  gap:9px; padding:2px 12px; font-size:11.5px; line-height:1.6;
  border-left:2px solid transparent; white-space:nowrap;
  animation:slidein .22s ease-out;
}
@keyframes slidein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.logline:hover{background:rgba(60,230,139,.06)}
.logline .t{color:var(--ink-faint)}
.logline .lv{font-weight:700; text-align:center}
.logline .dm{color:var(--cyan); opacity:.75; font-size:10px}
.logline .tg{color:var(--ink-dim); font-size:10px; overflow:hidden; text-overflow:ellipsis}
.logline .ms{color:var(--ink); overflow:hidden; text-overflow:ellipsis}

.logline.lv-I{border-left-color:transparent}
.logline.lv-W{border-left-color:var(--amber); background:rgba(255,176,46,.05)}
.logline.lv-W .lv{color:var(--amber)}
.logline.lv-E,.logline.lv-F{border-left-color:var(--crimson); background:rgba(255,77,77,.07)}
.logline.lv-E .lv,.logline.lv-F .lv{color:var(--crimson)}
.logline.lv-I .lv{color:var(--phosphor); opacity:.6}
.logline.lv-D .lv{color:var(--ink-faint)}
.logline .faultpill{
  display:inline-block; font-size:9.5px; padding:0 4px; margin-right:5px;
  border:1px solid var(--crimson); color:var(--crimson); vertical-align:1px;
}
.logline .kv{color:var(--phosphor); opacity:.85}
.logline .zz{color:var(--violet); font-weight:600}

/* 光标 */
.caret{display:inline-block;width:7px;height:13px;background:var(--phosphor);
  vertical-align:-2px;animation:blink 1.05s step-end infinite;margin-left:3px}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* ── 工具条 ─────────────────────────────────────────────────────────── */
.toolbar{
  display:flex; gap:7px; padding:7px 11px; border-bottom:1px solid var(--line);
  background:var(--panel-2); flex-wrap:wrap; align-items:center;
}
.toolbar input,.toolbar select{
  background:rgba(7,9,10,.8); border:1px solid var(--line-hard); color:var(--ink);
  font-family:var(--mono); font-size:11px; padding:3px 7px; outline:none;
}
.toolbar input:focus,.toolbar select:focus{border-color:var(--phosphor)}
.toolbar input{width:150px}
.btn{
  background:transparent; border:1px solid var(--line-hard); color:var(--ink-dim);
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em;
  padding:3px 10px; cursor:pointer; transition:all .13s; text-transform:uppercase;
}
.btn:hover{border-color:var(--phosphor); color:var(--phosphor); background:rgba(60,230,139,.07)}
.btn.on{background:var(--phosphor); color:#04120a; border-color:var(--phosphor); font-weight:700}

/* ── 报告列表 ───────────────────────────────────────────────────────── */
.rep{
  padding:8px 11px; border-bottom:1px solid rgba(120,200,170,.07);
  cursor:pointer; transition:background .12s;
}
.rep:hover{background:rgba(60,230,139,.06)}
.rep.sel{background:rgba(60,230,139,.1); border-left:2px solid var(--phosphor)}
.rep .rn{font-size:11px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rep .rm{font-size:9.5px; color:var(--ink-faint); margin-top:2px; display:flex; gap:8px}

/* 报告阅读器（浮层） */
.reader{
  position:fixed; inset:0; z-index:9000; display:none;
  background:rgba(4,6,7,.92); backdrop-filter:blur(3px);
}
.reader.open{display:flex; align-items:center; justify-content:center}
.reader .sheet{
  width:min(980px,92vw); height:88vh; display:flex; flex-direction:column;
  border:1px solid var(--line-hard); background:#0a0f11;
}
.reader header{
  display:flex; align-items:center; gap:10px; padding:9px 14px;
  border-bottom:1px solid var(--line); background:var(--panel-2);
}
.reader header h3{font-family:var(--disp); font-size:12px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--phosphor)}
.reader .md{overflow:auto; padding:24px 34px; font-family:var(--mono); font-size:12.5px; line-height:1.75}
.reader .md h1{font-family:var(--disp); font-size:21px; color:var(--phosphor);
  margin:0 0 16px; letter-spacing:.02em; border-bottom:1px solid var(--line); padding-bottom:10px}
.reader .md h2{font-size:13px; color:var(--amber); margin:22px 0 8px; letter-spacing:.06em}
.reader .md table{border-collapse:collapse; margin:10px 0; font-size:11.5px}
.reader .md th,.reader .md td{border:1px solid var(--line); padding:4px 10px; text-align:left}
.reader .md th{background:var(--panel-2); color:var(--ink-dim); font-weight:400}
.reader .md pre{
  background:#05080a; border:1px solid var(--line); border-left:2px solid var(--phosphor);
  padding:11px 14px; overflow-x:auto; font-size:11px; color:var(--phosphor); line-height:1.7;
}
.reader .md code{background:rgba(60,230,139,.1); padding:1px 4px; color:var(--phosphor)}
.reader .md pre code{background:none; padding:0}
.reader .md blockquote{
  border-left:2px solid var(--amber); padding:8px 14px; margin:12px 0;
  background:rgba(255,176,46,.06); color:var(--amber); font-size:11.5px;
}
.reader .md strong{color:var(--ink)} .reader .md hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.reader .md ul,.reader .md ol{margin:8px 0 8px 22px}

/* 空态 / 载入 */
.empty{padding:28px 16px; text-align:center; color:var(--ink-faint); font-size:11px}
.boot{
  position:fixed; inset:0; z-index:9998; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
}
.boot.hide{display:none}
.boot .t{font-family:var(--disp); font-size:26px; letter-spacing:.3em; color:var(--phosphor);
  text-shadow:0 0 24px rgba(60,230,139,.4)}
.boot .s{font-size:11px; color:var(--ink-faint); letter-spacing:.16em}
</style>
</head>
<body>

<!-- 启动画面 -->
<div class="boot" id="boot">
  <div class="t">AGRI-OPS</div>
  <div class="s" id="bootMsg">正在连接日志分析服务…</div>
</div>

<div class="shell">

  <!-- ══ 顶栏 ══ -->
  <div class="topbar">
    <div class="brand">
      <h1>AGRI-OPS</h1>
      <div class="sub">OpenHarmony 温室集群 · 日志智能聚合分析</div>
    </div>
    <div class="live" id="modeBadge"><span class="dot"></span><span id="srcName">SOURCE</span></div>
    <!-- 设备端模式：读固件发的 AgriMode 日志。演示时"到底开没开注入"必须三处一致：
         板载 OLED 显示、日志里有 AgriMode 行、看板这里也显示 -->
    <div class="devmode" id="devMode" title="设备端当前的运行模式（来自固件的 AgriMode 日志）。按板子上的 KEY 按键切换。">
      <span id="devModeTxt">设备模式 –</span>
    </div>
    <!-- 设备选择器：整块看板聚焦到一个棚（真实运维的视角） -->
    <div class="devsel" title="选择要分析的设备。选中某个棚后，窗口/时间线/异常族/报告都只由这个棚的日志算出，异常判定不会被别的棚的正常日志摊薄。">
      <span class="lb">设备</span>
      <select id="devSel"><option value="">全部（6 个棚）</option></select>
    </div>
    <div class="kpis">
      <div class="kpi"><span class="k">日志行数</span><span class="v g" id="kLines">–</span></div>
      <div class="kpi"><span class="k">解析率</span><span class="v g" id="kParse">–<span class="u">%</span></span></div>
      <div class="kpi"><span class="k">时间跨度</span><span class="v" id="kDur">–</span></div>
      <div class="kpi"><span class="k">异常窗口</span><span class="v c" id="kAnom">–</span></div>
      <div class="kpi"><span class="k">异常族</span><span class="v a" id="kFam">–</span></div>
      <div class="kpi"><span class="k">最长行</span><span class="v a" id="kLine">–<span class="u">B</span></span></div>
    </div>
  </div>

  <!-- ══ 主网格 ══ -->
  <div class="grid" id="grid" style="grid-row:2/4">
    <!-- 拖拽条（位置由 JS 按实际面板边界计算） -->
    <div class="splitter v" data-k="gc1"></div>
    <div class="splitter v" data-k="gc3"></div>
    <div class="splitter h" data-k="gr1"></div>
    <div class="splitter h" data-k="gr2"></div>

    <!-- 故障码 -->
    <section class="panel faults">
      <header><h2>故障码分布</h2><span class="cnt" id="faultCnt"></span></header>
      <div class="body" id="faultList"><div class="empty">加载中…</div></div>
    </section>

    <!-- 异常族聚合（智能聚合的可见结果）-->
    <section class="panel fams">
      <header>
        <h2>异常族聚合</h2>
        <span class="cnt" id="famCnt"></span>
      </header>
      <div class="body" id="famList"><div class="empty">加载中…</div></div>
    </section>

    <!-- 时间线 -->
    <section class="panel timeline">
      <header><h2>日志密度时间线</h2><span class="cnt" id="tlHint">按秒聚合</span></header>
      <div class="chart-wrap"><canvas id="tlCanvas" height="150"></canvas></div>
      <div class="legend">
        <span><i style="background:var(--phosphor)"></i>INFO</span>
        <span><i style="background:var(--amber)"></i>WARN</span>
        <span><i style="background:var(--crimson)"></i>ERROR</span>
        <span style="margin-left:auto;color:var(--ink-faint)" id="tlRange"></span>
      </div>
    </section>

    <!-- 大棚环境 -->
    <section class="panel zones">
      <header>
        <h2>环境曲线</h2>
        <div class="metricsel" id="metricSel" title="选择要显示的曲线。'全部'会把温度/湿度/光照归一化后画在同一张图上，用于看变化趋势是否同步。">
          <button class="mb on" data-m="all">全部</button>
          <button class="mb" data-m="temp">温度</button>
          <button class="mb" data-m="humi">湿度</button>
          <button class="mb" data-m="light">光照</button>
        </div>
        <button class="btn big" id="btnZoneBig" title="把当前指标放大到整屏观看，所有设备叠在一起对比">放大</button>
        <span class="cnt" id="zoneCnt"></span>
      </header>
      <div class="body"><div class="zgrid" id="zoneGrid"></div></div>
    </section>

    <!-- 日志流（主角）-->
    <section class="panel stream">
      <header>
        <h2 id="streamTitle">日志流</h2>
        <span class="modechip" id="streamMode"></span>
        <span class="cnt" id="streamCnt"></span>
      </header>
      <div class="toolbar">
        <button class="btn on" data-lv="">全部</button>
        <button class="btn" data-lv="W">≥WARN</button>
        <button class="btn" data-lv="E">ERROR</button>
        <select id="fZone"><option value="">全部设备</option></select>
        <select id="fTag"><option value="">全部模块</option></select>
        <input id="fQ" placeholder="正则 / 关键词…">
        <button class="btn" id="btnClr">清空</button>
        <button class="btn rc" id="btnReconnect" style="margin-left:auto">重新连接</button>
      </div>
      <div class="body" id="stream"><div class="empty">加载中…</div></div>
    </section>

    <!-- 报告 -->
    <section class="panel reports">
      <header>
        <h2>根因报告</h2>
        <span class="cnt" id="repCnt"></span>
        <button class="btn src" id="btnRepSrc" title="切换报告来源范围">只看真机</button>
        <button class="btn an" id="btnAnalyze">生成根因报告</button>
      </header>
      <div class="body" id="repList"><div class="empty">加载中…</div></div>
    </section>
  </div>
</div>

<!-- 曲线放大浮层 -->
<div class="bigchart" id="bigChart">
  <header>
    <h3 id="bigTitle">环境曲线</h3>
    <span class="cnt" id="bigHint"></span>
    <button class="btn" id="bigClose" style="margin-left:auto">关闭 ESC</button>
  </header>
  <div class="wrap"><canvas id="bigCanvas"></canvas></div>
  <div class="lg" id="bigLegend"></div>
</div>

<!-- 报告阅读器 -->
<div class="reader" id="reader">
  <div class="sheet">
    <header>
      <h3 id="readerTitle">REPORT</h3>
      <button class="btn" id="readerClose" style="margin-left:auto">关闭 ESC</button>
    </header>
    <div class="md" id="readerBody"></div>
  </div>
</div>

<script>
/* ═════════════════════════════════════════════════════════════════════════
   前端逻辑：纯原生 JS，无框架、无 CDN（保证答辩现场离线可用）
   ═════════════════════════════════════════════════════════════════════════ */
const $ = (s)=>document.querySelector(s);
const api = async (p)=>{ const r = await fetch(p); if(!r.ok) throw new Error(r.status); return r.json(); };

const COLOR = {I:'#3ce68b', W:'#ffb02e', E:'#ff4d4d', F:'#ff4d4d', D:'#6f8a82'};
const state = { records:[], playing:false, timer:null, cursor:0,
                filter:{level:'',zone:'',tag:'',q:''},
                mode:'replay', liveCursor:0, liveTimer:null,
                liveSource:'', isSim:false, panelTimer:null,
                zone:'',            /* ← 当前聚焦的设备（'' = 全部） */
                repSrc:'live',      /* ← 报告来源范围：live 只看真机 / all 含模拟 */
                repAll:null,
                metric:'all',      /* 环境曲线当前指标：all/temp/humi/light */
                lastZones:null };

/* 给所有派生接口带上当前设备范围。
   整块看板共用这一个 scope：切了设备之后，KPI/时间线/异常族/报告/日志流
   全都只反映这个棚，异常判定不会被别的棚的正常日志摊薄。 */
function ZQ(path){
  if(!state.zone) return path;
  return path + (path.indexOf('?') >= 0 ? '&' : '?') + 'zone=' + state.zone;
}

/* HTML 转义：日志原文和错误信息都可能带 < > &，直接插进 innerHTML 会破坏结构 */
function escHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* 模式徽标的统一文案（在线/离线两态，避免各处拼字符串拼歪） */
function liveLabel(online){
  const who = state.isSim ? '模拟器' : (state.liveSource || '设备');
  return online ? ('实时 · ' + who) : ('离线 · ' + who + '已停');
}
/* 日志流标题旁的模式提示条 */
function setStreamChip(kind, text){
  const c = $('#streamMode');
  if(!c) return;
  c.className = 'modechip ' + kind;
  c.textContent = text;
}

/* ── 小工具 ─────────────────────────────────────────────────────────── */
function fmtDur(s){
  s = Math.round(s);
  if(s < 60) return s + 's';
  if(s < 3600) return Math.floor(s/60) + 'm' + String(s%60).padStart(2,'0') + 's';
  return Math.floor(s/3600) + 'h' + String(Math.floor(s%3600/60)).padStart(2,'0') + 'm';
}
function fmtTs(t){
  if(t==null) return '------.------';
  const i = Math.floor(t), f = Math.round((t-i)*1e6);
  return String(i).padStart(6,'0') + '.' + String(f).padStart(6,'0');
}
/* 极简 Markdown → HTML（够用即可，不引库） */
function md2html(md){
  const esc = (s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = md.split('\n'); let out=[], inPre=false, inUl=false, inTbl=false;
  for(let raw of lines){
    const l = raw.replace(/\r$/,'');
    if(l.trim().startsWith('```')){
      if(!inPre){ out.push('<pre><code>'); inPre=true; } else { out.push('</code></pre>'); inPre=false; }
      continue;
    }
    if(inPre){ out.push(esc(l)); continue; }
    if(/^\s*\|/.test(l)){
      const cells = l.split('|').slice(1,-1).map(c=>c.trim());
      if(cells.every(c=>/^:?-+:?$/.test(c))) continue;
      if(!inTbl){ out.push('<table>'); inTbl=true; }
      const tag = out[out.length-1]==='<table>' ? 'th' : 'td';
      out.push('<tr>'+cells.map(c=>`<${tag}>${inline(c)}</${tag}>`).join('')+'</tr>');
      continue;
    } else if(inTbl){ out.push('</table>'); inTbl=false; }
    if(/^###\s+/.test(l)) { out.push('<h3>'+inline(l.replace(/^###\s+/,''))+'</h3>'); continue; }
    if(/^##\s+/.test(l))  { out.push('<h2>'+inline(l.replace(/^##\s+/,''))+'</h2>'); continue; }
    if(/^#\s+/.test(l))   { out.push('<h1>'+inline(l.replace(/^#\s+/,''))+'</h1>'); continue; }
    if(/^&gt;\s?/.test(esc(l))||/^>\s?/.test(l)){ out.push('<blockquote>'+inline(l.replace(/^>\s?/,''))+'</blockquote>'); continue; }
    if(/^---+$/.test(l.trim())){ out.push('<hr>'); continue; }
    if(/^\s*[-*]\s+/.test(l)){
      if(!inUl){ out.push('<ul>'); inUl=true; }
      out.push('<li>'+inline(l.replace(/^\s*[-*]\s+/,''))+'</li>'); continue;
    } else if(inUl){ out.push('</ul>'); inUl=false; }
    if(l.trim()===''){ out.push(''); continue; }
    out.push('<p>'+inline(l)+'</p>');
  }
  if(inTbl) out.push('</table>');
  if(inUl) out.push('</ul>');
  function inline(s){
    return esc(s)
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/&lt;(sub|sup)&gt;/g,'<$1>');
  }
  return out.join('\n').replace(/<sub>/g,'<sub style="color:#44544f;font-size:10px">');
}

/* ── 启动流程 ───────────────────────────────────────────────────────── */
(async function boot(){
  try{
    const meta = await api(ZQ('/api/meta'));
    state.mode = meta.mode || 'replay';

    /* 设备清单 —— 让用户能聚焦到单个棚 */
    try{
      const devs = await api('/api/devices');
      const sel = $('#devSel');
      sel.innerHTML = '<option value="">全部（6 个棚）</option>' +
        devs.map(d=>`<option value="${d.zone}">${d.zone} · ${d.name}（${d.count}）</option>`).join('');
    }catch(e){ /* 无设备清单也不影响主流程 */ }

    /* ── 模式标识：回放/实时一眼可辨，避免误认为连着真机 ── */
    const badge = $('#modeBadge');
    state.liveSource = (meta.live && meta.live.source) || '';
    state.isSim = state.liveSource === 'simulator';
    if(state.mode === 'live'){
      badge.classList.remove('replay');
      $('#srcName').textContent = liveLabel(true);
      badge.title = '实时模式：数据直接来自' + (state.isSim ? '模拟器进程' : '串口 ' + state.liveSource)
                  + '。\n数据源一停（关板子 / 拔线），这里会在 6 秒内变成红色 OFFLINE。';
      setStreamChip('live', '实时 · ' + (state.isSim ? '模拟器进程' : '串口 ' + state.liveSource));
    }else{
      badge.classList.add('replay');
      $('#srcName').textContent = '回放 · ' + meta.log_path.split('/').pop();
      badge.title = '当前是【回放模式】：循环播放静态日志文件，与开发板是否连接无关。\n'
                  + '要看实时数据请用 --live（真机串口）或 --live-sim（模拟器）';
      setStreamChip('replay',
        '回放中 · 循环播放 ' + meta.log_path.split('/').pop() + ' —— 与开发板是否通电/连接【无关】');
    }

    renderDeviceMode(meta.device_mode);
      $('#kLines').textContent = meta.records.toLocaleString();
    $('#kParse').innerHTML = meta.parse_rate + '<span class="u">%</span>';
    $('#kDur').textContent = fmtDur(meta.duration_s);
    $('#kAnom').textContent = meta.anomaly_windows + ' / ' + meta.windows;
    $('#kLine').innerHTML = meta.longest_line + '<span class="u">B</span>';
    $('#kLine').className = 'v ' + (meta.longest_line > 128 ? 'c' : 'a');
    $('#tlHint').textContent = (await api('/api/timeline'))[0]?.step > 1
      ? `每 ${(await api('/api/timeline'))[0].step} 秒聚合` : '按秒聚合';

    const [summary, tl, zones, reports, fams] = await Promise.all([
      api(ZQ('/api/summary')), api(ZQ('/api/timeline')), api(ZQ('/api/zones')),
      api('/api/reports'), api(ZQ('/api/families'))
    ]);

    renderFaults(summary);
    renderFamilies(fams);
    renderTimeline(tl);
    renderZones(zones);
    renderReports(reports);

    // 过滤器选项
    fillFilters(summary);

    // 预载日志（仅回放模式需要）
    if(state.mode !== 'live'){
      const first = await api('/api/logs?limit=2000');
      state.records = first.items;
      state.cursor = 0;
    }

    $('#boot').classList.add('hide');
    if(state.mode === 'live'){ startLive(); } else { startPlayback(); }
  }catch(e){
    $('#bootMsg').textContent = '❌ 加载失败：' + e.message;
  }
})();

/* ── 实时模式：轮询增量接口；板子停了立即显示离线 ───────────────────── */
function startLive(){
  const stream = $('#stream');
  stream.innerHTML = '';
  stream.insertAdjacentHTML('beforeend',
    '<div class="empty" id="liveWait">等待数据源…（窗口满 60s 后才会出现异常判定）</div>');
  let offline = false;
  let lastErr = '';

  /* 日志流：800ms 增量拉取 */
  const poll = async ()=>{
    try{
      const d = await api('/api/live/logs?since=' + state.liveCursor);
      state.liveCursor = d.next;

      const badge = $('#modeBadge');
      if(d.online){
        if(offline){ offline = false; badge.classList.remove('offline');
                     $('#srcName').textContent = liveLabel(true);
                     setStreamChip('live', '实时 · ' + (state.isSim ? '模拟器进程' : '串口 ' + state.liveSource));
                     setRcState('', '重新连接'); }
      }else if(!offline){
        offline = true; badge.classList.add('offline');
        $('#srcName').textContent = liveLabel(false);
        setStreamChip('offline', '数据源已断开 —— 日志流停止增长');
        setRcState('need', '重新连接');
        /* 掉线后自动触发一次强制重连：子进程是钉在端口号上重试的，
           板子拔了再插可能换成别的 COM 号，靠它自己等不回来。
           自动来一次，用户通常不用手动点。 */
        setTimeout(()=>{ if(offline) forceReconnect(true); }, 3000);
      }
      /* 离线原因直接写在流里，省得还要去翻接口 */
      if(!d.online && d.error && lastErr !== d.error){
        lastErr = d.error;
        stream.insertAdjacentHTML('beforeend',
          `<div class="logline" style="color:var(--crimson);border-left-color:var(--crimson)">
             <span class="t">${'------.------'}</span><span class="lv E">OFFLINE</span>
             <span class="tag">${escHtml(d.error)}</span></div>`);
      }

      const wait = $('#liveWait');
      if(wait && d.items.length) wait.remove();

      d.items.forEach(r=>{
        if(!logMatches(r)) return;
        stream.insertAdjacentHTML('beforeend', logLineHTML(r));
      });
      while(stream.querySelectorAll('.logline').length > 400) stream.removeChild(stream.firstChild);
      if(d.items.length) stream.scrollTop = stream.scrollHeight;
      $('#streamCnt').textContent = state.liveCursor + ' 行（实时）';
    }catch(e){
      $('#modeBadge').classList.add('offline');
      $('#srcName').textContent = '离线 · 看板连接断开';
      setStreamChip('offline', '与看板后端的连接已断开');
    }
  };
  poll();
  state.liveTimer = setInterval(poll, 800);

  /* 面板：3s 刷新一次汇总/时间线/分区（服务端有 2s 节流，不会算重）
     —— 实时模式下这几块不刷新的话，永远停在启动那一刻的空数据上。 */
  const refreshPanels = async ()=>{
    try{
      const [meta, summary, tl, zones, fams] = await Promise.all([
        api(ZQ('/api/meta')), api(ZQ('/api/summary')), api(ZQ('/api/timeline')),
        api(ZQ('/api/zones')), api(ZQ('/api/families'))
      ]);
      renderDeviceMode(meta.device_mode);
      $('#kLines').textContent = meta.records.toLocaleString();
      $('#kParse').innerHTML = meta.parse_rate + '<span class="u">%</span>';
      $('#kDur').textContent = fmtDur(meta.duration_s);
      $('#kAnom').textContent = meta.anomaly_windows + ' / ' + meta.windows;
      renderFaults(summary);
      renderFamilies(fams);
      renderTimeline(tl);
      renderZones(zones);
      fillFilters(summary);
    }catch(e){ /* 面板刷新失败不影响日志流 */ }
  };
  state.panelTimer = setInterval(refreshPanels, 3000);
}

/* ── 过滤器选项：可重复调用（实时模式下分区/标签会陆续出现）────────── */
function fillFilters(summary){
  const fz = $('#fZone'), ft = $('#fTag');
  const keepZ = fz.value, keepT = ft.value;
  fz.innerHTML = '<option value="">全部棚区</option>' +
    summary.zones.map(z=>`<option value="${z.zone}">${z.zone} 棚 (${z.count})</option>`).join('');
  ft.innerHTML = '<option value="">全部模块</option>' +
    summary.tags.map(t=>`<option value="${t.tag}">${t.tag} (${t.count})</option>`).join('');
  if(keepZ) fz.value = keepZ;
  if(keepT) ft.value = keepT;
}

/* ── 异常族聚合 ─────────────────────────────────────────────────────── */
function renderFamilies(list){
  const box = $('#famList');
  const famKpi = $('#kFam');
  if(famKpi) famKpi.textContent = list.length ? list.length : '0';
  $('#famCnt').textContent = list.length ? (list.length + ' 族') : '';
  if(!list.length){
    box.innerHTML = '<div class="empty">暂未发现异常族</div>';
    return;
  }
  box.innerHTML = list.map(f=>`
    <div class="fam" title="指纹 ${f.key}&#10;窗口 ${f.windows.join(', ')}">
      <span class="nm">${f.label}</span>
      <span class="ct">×${f.count}</span>
      <span class="meta">${f.span} ｜ ${f.zones.length?f.zones.join('/'):'全局'} ｜ E${f.err}/W${f.warn}
        ｜ <span class="key">${f.key}</span></span>
    </div>`).join('');
}

/* ── 故障码 ─────────────────────────────────────────────────────────── */
function renderFaults(s){

  $('#faultCnt').textContent = s.faults.length + ' 种';
  if(!s.faults.length){ box.innerHTML = '<div class="empty">未发现故障码</div>'; return; }

    <div class="fault ${f.normal?'normal':''}">

    </div>`).join('');

/* ── 时间线（自绘 Canvas）───────────────────────────────────────────── */
function renderTimeline(tl){
  const cv = $('#tlCanvas'), box = cv.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const W = box.clientWidth - 20, H = 150;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.height = H+'px';
  const g = cv.getContext('2d'); g.scale(dpr,dpr);
  g.clearRect(0,0,W,H);
  if(!tl.length) return;

  const padL=34, padB=16, padT=8;
  const plotW = W-padL-4, plotH = H-padT-padB;
  const maxV = Math.max(1, ...tl.map(d=>d.I+d.W+d.E));
  const x = i => padL + (i/(tl.length-1||1))*plotW;
  const y = v => padT + plotH - (v/maxV)*plotH;

  // 网格
  g.strokeStyle='rgba(120,200,170,.1)'; g.lineWidth=1;
  for(let i=0;i<=4;i++){ const yy=padT+plotH*i/4;
    g.beginPath(); g.moveTo(padL,yy); g.lineTo(W-4,yy); g.stroke();
    g.fillStyle='#44544f'; g.font='9px monospace'; g.textAlign='right';
    g.fillText(Math.round(maxV*(1-i/4)), padL-6, yy+3);
  }
  // 堆叠面积：ERROR(底) → WARN → INFO
  const stack = (key, color, base)=>{
    g.beginPath(); g.moveTo(x(0), y(base[0]));
    tl.forEach((d,i)=> g.lineTo(x(i), y(base[i]+d[key])));
    for(let i=tl.length-1;i>=0;i--) g.lineTo(x(i), y(base[i]));
    g.closePath(); g.fillStyle=color; g.fill();
  };
  const b0 = tl.map(()=>0);
  const bI = tl.map(d=>d.I);                  // INFO 在下
  const bIW = tl.map((d,i)=>d.I+d.W);
  stack('I','rgba(60,230,139,.55)', b0);
  stack('W','rgba(255,176,46,.7)', bI);
  stack('E','rgba(255,77,77,.85)', bIW);

  // 时间刻度
  g.fillStyle='#44544f'; g.font='9px monospace'; g.textAlign='center';
  [0, Math.floor(tl.length/2), tl.length-1].forEach(i=>{
    if(tl[i]) g.fillText(fmtDur(tl[i].t), x(i), H-4);
  });
  $('#tlRange').textContent = fmtDur(tl[0].t) + ' → ' + fmtDur(tl[tl.length-1].t);
}

/* ── 大棚卡片 ───────────────────────────────────────────────────────── */
/* ══ 环境曲线 ══════════════════════════════════════════════════════════
   三种指标各有自己的量纲：温度 ℃、湿度 %、光照（AP3216C 原始值）。
   直接把三条线画在一个坐标系里，光照会把温湿度压成一条直线 ——
   所以"全部"模式下【每条曲线各自归一化到自己的 min~max】，
   这样看的是【变化趋势是否同步】，而不是绝对数值大小。
   要读绝对数值就切到单指标模式，那时纵轴是真实刻度。
   ═══════════════════════════════════════════════════════════════════ */
const METRICS = {
  temp:  {key:'temp',  name:'温度', unit:'℃', color:'#ffb02e'},
  humi:  {key:'humi',  name:'湿度', unit:'%',  color:'#46c8d8'},
  light: {key:'light', name:'光照', unit:'',   color:'#3ce68b'},
};
const ZONE_COLORS = ['#3ce68b','#ffb02e','#46c8d8','#9d7bff','#ff4d4d','#7fd1ff'];

function activeMetrics(){
  const m = state.metric || 'all';
  return m === 'all' ? ['temp','humi','light'] : [m];
}

function renderZones(zones){
  const box = $('#zoneGrid');
  const ids = Object.keys(zones).sort();
  state.lastZones = zones;              /* 放大浮层与指标切换都要复用这份数据 */
  if(!ids.length){ box.innerHTML='<div class="empty">无设备数据</div>'; return; }
  box.classList.toggle('one', ids.length === 1);
  $('#zoneCnt').textContent = ids.length + ' 个设备';

  box.innerHTML = ids.map(z=>`
    <div class="zcard">
      <div class="zh"><span class="zz">${z}</span><span class="zn">${zones[z].name}</span></div>
      <canvas id="zc_${z}" data-zone="${z}"></canvas>
      <div class="zrow"><span>温度</span><span id="zt_${z}" style="color:${METRICS.temp.color}">–</span></div>
      <div class="zrow"><span>湿度</span><span id="zh_${z}" style="color:${METRICS.humi.color}">–</span></div>
      <div class="zrow"><span>光照</span><span id="zl_${z}" style="color:${METRICS.light.color}">–</span></div>
    </div>`).join('');
  ids.forEach(z=>drawZone(z, zones[z]));
}

/** 画一条曲线。norm=true 时按自身 min~max 归一化（多指标叠加用） */
function plotSeries(g, arr, W, H, color, norm, lo, hi){
  const vals = arr.filter(x=>x!=null);
  if(vals.length < 2) return null;
  let a = lo, b = hi;
  if(norm || a == null){
    a = Math.min(...vals);
    b = Math.max(...vals);
  }
  const span = (b - a) || 1;
  g.beginPath();
  let started = false;
  arr.forEach((v,i)=>{
    if(v == null) return;
    const px = (arr.length>1 ? i/(arr.length-1) : 0) * W;
    const py = H - 3 - ((v - a)/span) * (H - 8);
    started ? g.lineTo(px,py) : (g.moveTo(px,py), started = true);
  });
  g.strokeStyle = color; g.lineWidth = 1.6; g.stroke();
  return {lo:a, hi:b};
}

function drawZone(z, d){
  const cv = document.getElementById('zc_'+z); if(!cv) return;
  const dpr = window.devicePixelRatio||1;
  const W = Math.max(80, cv.parentElement.clientWidth - 20);
  const H = 56;                                  /* 原来是 26px，太矮看不清趋势 */
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);

  const ms = activeMetrics();
  if(ms.length === 1){
    /* 单指标：用真实刻度，并在左上角标出数值范围 */
    const m = METRICS[ms[0]];
    const r = plotSeries(g, d[m.key], W, H, m.color, false);
    if(r){
      g.fillStyle = 'rgba(255,255,255,.28)';
      g.font = '9px monospace';
      g.fillText(r.hi.toFixed(m.key==='light'?0:1) + m.unit, 2, 9);
      g.fillText(r.lo.toFixed(m.key==='light'?0:1) + m.unit, 2, H-2);
    }
  }else{
    /* 全部：各画各的归一化曲线，看趋势同步性 */
    ms.forEach(k=>plotSeries(g, d[METRICS[k].key], W, H, METRICS[k].color, true));
  }

  const last = a => { for(let i=a.length-1;i>=0;i--) if(a[i]!=null) return a[i]; return null; };
  const t=last(d.temp), h=last(d.humi), l=last(d.light);
  const set=(id,v)=>{ const el=$('#'+id); if(el) el.textContent=v; };
  set('zt_'+z, t!=null ? t.toFixed(1)+'℃' : '–');
  set('zh_'+z, h!=null ? h.toFixed(1)+'%' : '–');
  set('zl_'+z, l!=null ? l : '–');
}

/* ── 放大浮层：所有设备叠在一张大图上 ─────────────────────────────── */
function drawBigChart(){
  const cv = $('#bigCanvas'); if(!cv) return;
  const zones = state.lastZones || {};
  const ids = Object.keys(zones).sort();
  const ms = activeMetrics();
  const dpr = window.devicePixelRatio||1;
  const W = cv.parentElement.clientWidth, H = cv.parentElement.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);

  const padL = 52, padR = 14, padT = 14, padB = 26;
  const iw = W-padL-padR, ih = H-padT-padB;
  if(iw < 40 || ih < 40 || !ids.length) return;

  /* 多指标叠在一起时各归一化；单指标时用全局 min~max，这样设备间可比 */
  let globalLo = null, globalHi = null;
  if(ms.length === 1){
    const k = METRICS[ms[0]].key;
    const all = ids.flatMap(z=>(zones[z][k]||[]).filter(x=>x!=null));
    if(all.length){ globalLo = Math.min(...all); globalHi = Math.max(...all); }
  }

  /* 网格与纵轴刻度 */
  g.strokeStyle = 'rgba(255,255,255,.06)'; g.lineWidth = 1;
  g.fillStyle = 'rgba(255,255,255,.3)'; g.font = '10px monospace';
  for(let i=0;i<=4;i++){
    const y = padT + ih*i/4;
    g.beginPath(); g.moveTo(padL,y); g.lineTo(padL+iw,y); g.stroke();
    if(globalLo != null){
      const v = globalHi - (globalHi-globalLo)*i/4;
      const u = ms.length===1 ? METRICS[ms[0]].unit : '';
      g.fillText(v.toFixed(ms.length===1&&ms[0]==='light'?0:1)+u, 4, y+3);
    }
  }
  /* 时间轴刻度 */
  const tArr = ids.length ? (zones[ids[0]].t||[]) : [];
  if(tArr.length > 1){
    const t0 = tArr[0], t1 = tArr[tArr.length-1];
    g.fillStyle = 'rgba(255,255,255,.3)';
    for(let i=0;i<=6;i++){
      const x = padL + iw*i/6;
      g.beginPath(); g.moveTo(x,padT); g.lineTo(x,padT+ih); g.stroke();
      g.fillText(fmtDur(t0 + (t1-t0)*i/6), x-14, H-8);
    }
  }

  /* 曲线：每个设备一条线 */
  const legend = [];
  ids.forEach((z, zi)=>{
    ms.forEach(k=>{
      const m = METRICS[k];
      const color = ms.length === 1 ? ZONE_COLORS[zi % ZONE_COLORS.length] : m.color;
      const arr = zones[z][m.key] || [];
      const vals = arr.filter(x=>x!=null);
      if(vals.length < 2) return;
      let a = globalLo, b = globalHi;
      if(a == null){ a = Math.min(...vals); b = Math.max(...vals); }
      const span = (b-a)||1;
      g.beginPath();
      let started = false;
      arr.forEach((v,i)=>{
        if(v == null) return;
        const px = padL + (arr.length>1 ? i/(arr.length-1) : 0)*iw;
        const py = padT + ih - ((v-a)/span)*ih;
        started ? g.lineTo(px,py) : (g.moveTo(px,py), started = true);
      });
      g.strokeStyle = color;
      g.lineWidth = ms.length === 1 ? 2 : 1.5;
      g.globalAlpha = ms.length === 1 ? 1 : (k==='light'?0.55:0.85);
      g.stroke();
      g.globalAlpha = 1;
      if(zi === 0 || ms.length === 1)
        legend.push(`<span><i style="background:${color}"></i>${ms.length===1?z+' '+zones[z].name:m.name}</span>`);
    });
  });
  $('#bigLegend').innerHTML = legend.join('');
  $('#bigHint').textContent = ms.length === 1
    ? `${ids.length} 个设备叠图 ｜ 纵轴为真实刻度`
    : '各曲线已按自身范围归一化 —— 看的是趋势是否同步，不是绝对大小';
}

/* ══ 可拖动面板边框 ═══════════════════════════════════════════════════
   拖拽条的位置不写死，而是【按面板实际边界算】——
   网格有媒体查询、面板可能 display:none，写死坐标一定会错位。
   拖动只改 .grid 上的 CSS 变量，浏览器自己重排。
   ═══════════════════════════════════════════════════════════════════ */
const GRID_LIMITS = {
  gc1: [170, 460],    /* 左列宽 */
  gc3: [240, 760],    /* 右列宽 */
  gr1: [110, 420],    /* 第一行高 */
  gr2: [ 90, 420],    /* 第二行高 */
};

function layoutSplitters(){
  const grid = $('#grid'); if(!grid) return;
  if(getComputedStyle(grid).display === 'none') return;
  const gr = grid.getBoundingClientRect();
  const q = s => grid.querySelector(s);
  const faults = q('.faults'), timeline = q('.timeline'),
        zones = q('.zones'),  stream = q('.stream'), fams = q('.fams');
  if(!faults || !timeline || !faults.offsetParent) return;   /* 小屏时面板可能被隐藏 */

  const fr = faults.getBoundingClientRect();
  const tr = timeline.getBoundingClientRect();
  const zr = zones ? zones.getBoundingClientRect() : null;
  const sr = stream ? stream.getBoundingClientRect() : null;

  /* 竖直：左列右边界、中列右边界（= 右列左边界） */
  const v1 = fr.right + 5, v2 = tr.right + 5;
  /* 水平：第一行下边界（faults 只占第一行）、第二行下边界（timeline 占 1~2 行） */
  const h1 = fr.bottom + 5, h2 = tr.bottom + 5;

  grid.querySelectorAll('.splitter').forEach(sp=>{
    const k = sp.dataset.k;
    if(k === 'gc1'){ sp.style.left = (v1-gr.left)+'px'; sp.style.top='0'; sp.style.height='100%'; }
    if(k === 'gc3'){ sp.style.left = (v2-gr.left)+'px'; sp.style.top='0'; sp.style.height='100%'; }
    if(k === 'gr1'){ sp.style.top = (h1-gr.top)+'px';  sp.style.left='0'; sp.style.width='100%'; }
    if(k === 'gr2'){ sp.style.top = (h2-gr.top)+'px';  sp.style.left='0'; sp.style.width='100%'; }
    /* 被隐藏的面板对应的拖拽条也藏起来 */
    const hide = (k==='gc3' && !zr) || (k==='gr2' && !sr);
    sp.style.display = hide ? 'none' : '';
  });
}

(function(){
  const grid = $('#grid'); if(!grid) return;
  let dragging = null;

  grid.querySelectorAll('.splitter').forEach(sp=>{
    sp.addEventListener('mousedown', e=>{
      e.preventDefault();
      dragging = { sp, key: sp.dataset.k, start: 0 };
      const gr = grid.getBoundingClientRect();
      const cs = getComputedStyle(grid);
      if(dragging.key === 'gc1') dragging.base = parseFloat(cs.getPropertyValue('--gc1'));
      if(dragging.key === 'gc3') dragging.base = parseFloat(cs.getPropertyValue('--gc3'));
      if(dragging.key === 'gr1') dragging.base = parseFloat(cs.getPropertyValue('--gr1'));
      if(dragging.key === 'gr2') dragging.base = parseFloat(cs.getPropertyValue('--gr2'));
      dragging.sign = (dragging.key === 'gc3') ? -1 : 1;   /* 右列是从右边量的 */
      dragging.start = (dragging.key[1] === 'c') ? e.clientX : e.clientY;
      dragging.grid0 = (dragging.key[1] === 'c') ? gr.left : gr.top;
      dragging.abs0 = dragging.base + (dragging.key==='gc1' ? 0
                      : dragging.key==='gc3' ? (gr.width - dragging.base) : 0);
      sp.classList.add('drag');
      document.body.classList.add('resizing');
    });
  });

  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const isCol = dragging.key[1] === 'c';
    const lim = GRID_LIMITS[dragging.key];
    let v;
    if(dragging.key === 'gc1'){
      v = e.clientX - dragging.grid0;
    }else if(dragging.key === 'gc3'){
      const gr = grid.getBoundingClientRect();
      v = gr.right - e.clientX;
    }else if(dragging.key === 'gr1'){
      v = e.clientY - dragging.grid0;
    }else{
      const gr = grid.getBoundingClientRect();
      const g1 = parseFloat(getComputedStyle(grid).getPropertyValue('--gr1'));
      v = e.clientY - dragging.grid0 - g1 - 10;   /* 10 = gap */
    }
    v = Math.max(lim[0], Math.min(lim[1], v));
    grid.style.setProperty('--' + dragging.key, v + 'px');
    layoutSplitters();
    relayoutZones();
  });

  window.addEventListener('mouseup', ()=>{
    if(!dragging) return;
    dragging.sp.classList.remove('drag');
    document.body.classList.remove('resizing');
    dragging = null;
    /* 布局稳定后再重绘一次，避免拖拽过程中曲线拉到一半 */
    setTimeout(()=>{ layoutSplitters(); relayoutZones(); relayout(); }, 60);
  });

  /* 首屏 + 尺寸变化时重新定位拖拽条 */
  const reposition = ()=>{ layoutSplitters(); };
  window.addEventListener('resize', reposition);
  setTimeout(reposition, 60);
  setTimeout(reposition, 400);
})();

/* ── 环境曲线：指标切换 / 放大 / 重绘 ───────────────────────────────── */
function setMetric(m){

$('#bigChart').onclick = e=>{ if(e.target.id === 'bigChart') $('#bigChart').classList.remove('open'); };

/* 曲线面板尺寸变化后要重绘（canvas 不会自己跟着变） */
function relayoutZones(){
  renderZones(state.lastZones || {});
  layoutSplitters();
  if($('#bigChart').classList.contains('open')) drawBigChart();
}

/* 窗口/面板尺寸变化 → 用 ResizeObserver 精确跟随，比监听 resize 事件准 */
(function(){
  let t = null;
  const debounced = ()=>{ clearTimeout(t); t = setTimeout(relayoutZones, 120); };
  window.addEventListener('resize', debounced);
  if(window.ResizeObserver){
    const ro = new ResizeObserver(debounced);
    const zg = $('#zoneGrid'); if(zg) ro.observe(zg);
    const bc = $('#bigChart'); if(bc) ro.observe(bc);
  }
})();

/* ── 日志流 ─────────────────────────────────────────────────────────── */
function logMatches(r){
  const f = state.filter;
  const ord = {D:0,I:1,W:2,E:3,F:4};
  /* ★ 顶栏的设备选择优先：选了某个棚就只看这个棚的日志。
     注意 z=- 的日志（健康检查、启动）不属于任何单个棚，
     选了具体设备时会被过滤掉 —— 这是对的，它们不是"这个设备"的日志。 */
  if(state.zone && r.zone !== state.zone) return false;
  if(f.level && ord[r.level] < ord[f.level]) return false;
  if(f.zone && r.zone !== f.zone) return false;
  if(f.tag && r.tag !== f.tag) return false;
  if(f.q){ try{ if(!new RegExp(f.q,'i').test(r.raw)) return false; }catch(e){ return false; } }
  return true;
}
function logLineHTML(r){
  const kv = Object.entries(r.physical||{})
    .filter(([k])=>!['seq','fault','code','state','retry','miss','queue','rssi','thresh'].includes(k))
    .map(([k,v])=>`<span class="kv">${k}=${v}</span>`).join(' ');
  const pill = r.fault ? `<span class="faultpill">${r.fault}</span>` : '';
  const zone = r.zone ? `<span class="zz">${r.zone}</span>` : '';
  const detail = r.detail ? `<span style="color:var(--ink-dim)">${r.detail}</span>` : '';
  const tail = [pill, zone, kv, detail].filter(Boolean).join(' ') || r.raw.split(': ').slice(1).join(': ');
  return `<div class="logline lv-${r.level}">
    <span class="t">${fmtTs(r.ts)}</span>
    <span class="lv">${r.level}</span>
    <span class="dm">${r.domain}</span>
    <span class="tg" title="${r.tag}">${r.tag}</span>
    <span class="ms">${tail}</span>
  </div>`;
}
function startPlayback(){
  const stream = $('#stream');
  stream.innerHTML = '';
  if(state.timer) clearInterval(state.timer);
  state.timer = setInterval(()=>{
    const shown = stream.querySelectorAll('.logline').length;
    let added = 0;
    while(state.cursor < state.records.length && added < 3){
      const r = state.records[state.cursor++];
      if(logMatches(r)){ stream.insertAdjacentHTML('beforeend', logLineHTML(r)); added++; }
      if(state.cursor > 4000) { state.cursor = 0; }
    }
    // 只保留最近 400 行，避免 DOM 膨胀
    while(stream.querySelectorAll('.logline').length > 400) stream.removeChild(stream.firstChild);
    stream.scrollTop = stream.scrollHeight;
    $('#streamCnt').textContent = state.cursor + ' / ' + state.records.length + ' 行';
  }, 130);
}
function relayout(){
  api('/api/timeline').then(renderTimeline);
  api('/api/zones').then(z=>Object.keys(z).forEach(k=>drawZone(k,z[k])));
}
window.addEventListener('resize', relayout);

/* ── 过滤器交互 ─────────────────────────────────────────────────────── */
/* 过滤器变化 / 清屏：两种模式都要从头发一遍，否则实时模式只剩新行 */
function resetStream(){
  state.cursor = 0;
  if(state.mode === 'live') state.liveCursor = 0;
  $('#stream').innerHTML = '';
}
document.querySelectorAll('[data-lv]').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('[data-lv]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    state.filter.level = b.dataset.lv;
    resetStream();
  };
});
$('#fZone').onchange = e=>{ state.filter.zone = e.target.value; resetStream(); };
$('#fTag').onchange  = e=>{ state.filter.tag  = e.target.value; resetStream(); };
let qT=null;
$('#fQ').oninput = e=>{
  clearTimeout(qT);
  qT = setTimeout(()=>{ state.filter.q = e.target.value.trim(); resetStream(); }, 300);
};
$('#btnClr').onclick = resetStream;

/* 设备端模式：读 /api/meta 的 device_mode（来自固件 AgriMode 日志） */
function renderDeviceMode(dm){
  const box = $('#devMode');
  if(!box || !dm) return;
  if(!dm.known){
    box.className = 'devmode';
    $('#devModeTxt').textContent = '设备模式 未知';
    return;
  }
  box.className = 'devmode ' + (dm.injecting ? 'inject' : 'real');
  $('#devModeTxt').textContent = '设备模式 ' + dm.label;
  box.title = dm.injecting
    ? '设备端【正在注入故障】—— 日志里的 F1001/F1004/F3005 等是主动注入的，\n'
      + '用来验证分析链路。按板子上的 KEY 按键可切回"纯真实数据"。\n'
      + '注入的故障带设备号 z=A，真实硬件故障是 z=-。'
    : '设备端【纯真实数据】—— 只有真实传感器读数（SHT20 温湿度 + AP3216C 光照），\n'
      + '没有任何注入的故障日志。按板子上的 KEY 按键可开启故障注入。';
}

/* 距今多久：报告列表上直接显示"3 分钟前"，一眼看出新旧 */
function fmtAge(s){
  if(s == null) return '';
  s = Math.round(s);
  if(s < 60) return s + ' 秒前';
  if(s < 3600) return Math.floor(s/60) + ' 分钟前';
  if(s < 86400) return Math.floor(s/3600) + ' 小时前';
  return Math.floor(s/86400) + ' 天前';
}

/* ── 报告 ───────────────────────────────────────────────────────────── */
/* 报告来源范围：默认【只看真机】。
   模拟数据集算出来的报告和真机报告摆在一起，演示时极容易被误认为都是真的。
   默认过滤掉，需要对比时再手动切到"显示全部"。 */
function repFilter(){
  return state.repSrc || 'live';
}
function applyRepFilter(list){
  return repFilter() === 'live'
    ? list.filter(r=>r.source_kind === 'live')
    : list;
}
async function renderReports(rawList){
  const box = $('#repList');
  const all = rawList || await api('/api/reports');
  state.repAll = all;
  const list = applyRepFilter(all);
  const liveN = all.filter(r=>r.source_kind==='live').length;
  const simN = all.length - liveN;

  const b = $('#btnRepSrc');
  const onlyLive = repFilter() === 'live';
  b.className = 'btn src' + (onlyLive ? '' : ' all');
  b.textContent = onlyLive ? ('只看真机' + (liveN ? ' ' + liveN : ''))
                           : ('含模拟 ' + simN);

  $('#repCnt').textContent = list.length + ' 份'
    + (onlyLive && simN ? '（已隐藏 ' + simN + ' 份模拟数据集报告）' : '');

  if(!list.length){
    box.innerHTML = onlyLive
      ? '<div class="empty">还没有【真机】报告<br><br>'
        + '板子接好后点右上角<b style="color:var(--cyan)">「生成根因报告」</b><br>'
        + '<span style="color:var(--ink-faint)">（当前已隐藏 '
        + simN + ' 份模拟数据集报告）</span></div>'
      : '<div class="empty">还没有生成报告<br><br>运行：<br>'
        + '<code style="color:var(--phosphor);font-size:10px">'
        + '.\\run.ps1 tools/analyze_demo.py --input &lt;log&gt;</code></div>';
    return;
  }
  box.innerHTML = list.map(r=>`
    <div class="rep" data-name="${r.name}">
      <div class="rn" title="${r.name}">${r.name.replace(/\.md$/,'')}</div>
      <div class="rm">
        <span class="src ${r.source_kind}">${r.source||r.dir}</span>
        <span title="${r.mtime} 生成">${fmtAge(r.age_s)}</span>
        <span>${r.kb} KB</span>
      </div>
    </div>`).join('');
  box.querySelectorAll('.rep').forEach(el=>{
    el.onclick = async ()=>{
      box.querySelectorAll('.rep').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      const d = await api('/api/report?name=' + encodeURIComponent(el.dataset.name));
      $('#readerTitle').textContent = d.name;
      $('#readerBody').innerHTML = d.error ? d.error : md2html(d.markdown);
      $('#reader').classList.add('open');
    };
  });
}
$('#btnRepSrc').onclick = ()=>{
  state.repSrc = (repFilter() === 'live') ? 'all' : 'live';
  renderReports(state.repAll);
};

/* ── 对当前实时数据生成根因报告 ─────────────────────────────────────── */
function setAnState(kind, text){
  const b = $('#btnAnalyze');
  b.className = 'btn' + (kind ? ' ' + kind : '');
  b.textContent = text;
  b.disabled = (kind === 'busy');
}
async function runAnalyze(){
  const scope = state.zone ? (state.zone + ' 棚') : '全部设备';
  setAnState('busy', '分析中…');
  const r = await api(ZQ('/api/analyze?max=2'));
  if(!r.started){ setAnState('', '生成根因报告'); alert(r.reason || '未能启动'); return; }
  const t0 = Date.now();
  const timer = setInterval(async ()=>{
    let st;
    try{ st = await api('/api/analyze?action=status'); }catch(e){ return; }
    const sec = Math.round((Date.now()-t0)/1000);
    if(st.running){
      setAnState('busy', '分析中 ' + sec + 's（' + (st.log && st.log.length ? st.log[st.log.length-1].slice(9) : '') + '）');
      return;
    }
    clearInterval(timer);
    if(st.error){ setAnState('', '生成根因报告'); alert('分析失败：' + st.error); return; }
    setAnState('', '生成根因报告');
    /* 分析完立刻刷新报告列表，新报告出现在最前面 */
    renderReports(await api('/api/reports'));
    $('#repList').insertAdjacentHTML('afterbegin',
      `<div class="anNote">刚对【${escHtml(scope)}】的实时真机数据生成 ${st.reports.length} 份报告`
      + `（窗口 ${st.windows} 个 / 异常 ${st.anomalies} 个，${st.elapsed_s}s）</div>`);
  }, 1500);
}
$('#btnAnalyze').onclick = runAnalyze;

/* ── 强制重连 ───────────────────────────────────────────────────────
   为什么需要这个按钮：采集子进程自带断线重连，但它是**钉在一个端口号**上重试的。
   板子拔了再插，Windows 很可能把它枚举成别的 COM 号（实测 COM3→COM4→COM5→COM3），
   子进程还在死磕那个已经不存在的口 —— 现象就是"插回去了却接不上"。
   这个按钮让后端把子进程连根拔掉、重新发现端口再开。 */
function setRcState(kind, text){
  const b = $('#btnReconnect');
  if(!b) return;
  b.className = 'btn rc' + (kind ? ' ' + kind : '');
  b.textContent = text;
  b.disabled = (kind === 'busy');
}
let rcBusy = false;
async function forceReconnect(auto){
  if(rcBusy) return;
  rcBusy = true;
  setRcState('busy', auto ? '自动重连中…' : '重连中…');
  try{
    const r = await api('/api/live/reconnect');
    if(!r.ok){ setRcState('', '重新连接'); if(!auto) alert(r.reason || '重连失败'); }
    else{
      /* 重连成功不代表马上有数据，等下一次 poll 拿到 online 再恢复外观 */
      setTimeout(()=>{ if(rcBusy){ rcBusy = false; setRcState('need','重新连接'); } }, 6000);
    }
  }catch(e){ rcBusy = false; setRcState('', '重新连接'); }
}
$('#btnReconnect').onclick = ()=>forceReconnect(false);

/* ── 设备选择：切换后整块看板换视角 ─────────────────────────────────── */
async function applyZone(zone){
  state.zone = zone || '';
  const box = $('#devSel').parentElement;
  if(box) box.classList.toggle('on', !!state.zone);
  resetStream();                       /* 日志流从头发一遍（只显示该设备） */

  if(state.mode === 'live'){
    /* 实时模式：拉一次面板数据立刻刷新，不用等 3 秒轮询 */
    try{
      const [meta, summary, tl, zones, fams] = await Promise.all([
        api(ZQ('/api/meta')), api(ZQ('/api/summary')), api(ZQ('/api/timeline')),
        api(ZQ('/api/zones')), api(ZQ('/api/families'))
      ]);
      renderDeviceMode(meta.device_mode);
      $('#kLines').textContent = meta.records.toLocaleString();
      $('#kDur').textContent = fmtDur(meta.duration_s);
      $('#kAnom').textContent = meta.anomaly_windows + ' / ' + meta.windows;
      renderFaults(summary); renderFamilies(fams);
      renderTimeline(tl); renderZones(zones);
    }catch(e){}
  }else{
    /* 回放模式：重新预载该设备的日志 */
    try{
      const first = await api(ZQ('/api/logs?limit=2000'));
      state.records = first.items; state.cursor = 0;
      const [summary, tl, zones, fams] = await Promise.all([
        api(ZQ('/api/summary')), api(ZQ('/api/timeline')),
        api(ZQ('/api/zones')), api(ZQ('/api/families'))
      ]);
      renderFaults(summary); renderFamilies(fams);
      renderTimeline(tl); renderZones(zones);
    }catch(e){}
  }
}
$('#devSel').onchange = e=>applyZone(e.target.value);

$('#readerClose').onclick = ()=> $('#reader').classList.remove('open');
document.addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  /* 放大浮层在最上层，ESC 先关它 */
  if($('#bigChart').classList.contains('open')){ $('#bigChart').classList.remove('open'); return; }
  $('#reader').classList.remove('open');
});
$('#reader').onclick = e=>{ if(e.target.id==='reader') $('#reader').classList.remove('open'); };
</script>
